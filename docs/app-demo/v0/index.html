<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MicroDuck App v0 存档</title>
  <style>
    :root {
      --paper: #f7f4ed;
      --card: #fffdf8;
      --ink: #20242a;
      --muted: #6c706f;
      --line: #e7dfd0;
      --duck: #f5b82e;
      --duck-dark: #c78d06;
      --teal: #168f83;
      --teal-soft: #e4f4f0;
      --red: #d94242;
      --shadow: 0 12px 36px rgba(67, 52, 22, .10);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #e9e5dc; }
    button, input { font: inherit; }
    .site {
      min-height: 100vh;
      padding: 56px 24px 80px;
      background:
        radial-gradient(circle at 15% 0%, rgba(245,184,46,.20), transparent 27rem),
        #efede7;
    }
    .hero { max-width: 1160px; margin: auto; }
    .eyebrow { color: var(--duck-dark); font-weight: 750; letter-spacing: .08em; }
    h1 { margin: 10px 0 14px; font-size: clamp(36px, 6vw, 66px); letter-spacing: -.05em; }
    .lead { max-width: 760px; color: var(--muted); font-size: 19px; line-height: 1.65; }
    .decision {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
      margin: 28px 0 52px;
    }
    .decision div {
      background: rgba(255,255,255,.65); border: 1px solid #fff; border-radius: 18px;
      padding: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.04);
    }
    .decision b { display: block; margin-bottom: 6px; }
    .decision span { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .gallery {
      max-width: 1160px; margin: auto;
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px;
    }
    .shot-card { min-width: 0; }
    .shot-card img {
      display: block; width: 100%; border-radius: 34px;
      box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,.8);
    }
    .shot-meta { padding: 16px 6px; }
    .shot-meta h2 { margin: 0 0 5px; font-size: 20px; }
    .shot-meta p { margin: 0 0 12px; color: var(--muted); font-size: 14px; min-height: 42px; }
    .download {
      display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
      color: var(--ink); background: var(--duck); border-radius: 999px;
      padding: 9px 14px; font-size: 14px; font-weight: 750;
    }
    .rules {
      max-width: 1160px; margin: 60px auto 0; background: #20242a; color: white;
      border-radius: 28px; padding: 30px;
    }
    .rules h2 { margin-top: 0; }
    .rules-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .rules p { color: #ced0d2; line-height: 1.65; }
    .video-link { color: var(--duck); }
    .interaction-guide {
      max-width: 1160px; margin: 34px auto 0; display: grid;
      grid-template-columns: repeat(3, 1fr); gap: 18px;
    }
    .interaction-guide article {
      background: white; border: 1px solid white; border-radius: 24px; padding: 23px;
      box-shadow: 0 8px 25px rgba(0,0,0,.04);
    }
    .interaction-guide h2 { grid-column: 1/-1; margin: 10px 0 0; font-size: 28px; }
    .interaction-guide h3 { margin: 0 0 14px; }
    .interaction-guide ul { margin: 0; padding-left: 19px; color: var(--muted); line-height: 1.65; }
    .interaction-guide li + li { margin-top: 8px; }

    /* Exact 430 × 932 render surface used to create the downloadable shots. */
    .render-page { background: var(--paper); width: 430px; height: 932px; overflow: hidden; }
    .phone {
      width: 430px; height: 932px; position: relative; overflow: hidden;
      background:
        linear-gradient(rgba(245,184,46,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245,184,46,.025) 1px, transparent 1px),
        var(--paper);
      background-size: 28px 28px;
    }
    .statusbar {
      height: 46px; padding: 15px 23px 0; display: flex; justify-content: space-between;
      font-size: 14px; font-weight: 700;
    }
    .screen {
      height: calc(100% - 46px); padding: 10px 20px 92px; overflow: hidden;
    }
    .screen.full { padding-bottom: 22px; }
    .topbar { display: flex; align-items: center; min-height: 46px; gap: 12px; }
    .topbar h1 { font-size: 27px; margin: 0; letter-spacing: -.035em; flex: 1; }
    .back { font-size: 30px; line-height: 1; }
    .pill {
      display: inline-flex; align-items: center; gap: 7px; border-radius: 999px;
      background: #fff; border: 1px solid var(--line); padding: 8px 12px;
      font-size: 13px; font-weight: 700;
    }
    .pill.good { color: var(--teal); background: var(--teal-soft); border-color: transparent; }
    .subtitle { margin: 2px 0 16px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .card {
      background: rgba(255,253,248,.95); border: 1px solid var(--line);
      border-radius: 21px; box-shadow: 0 7px 19px rgba(67,52,22,.06);
      padding: 17px; margin-bottom: 13px;
    }
    .hero-card { min-height: 242px; position: relative; overflow: hidden; }
    .robot {
      width: 132px; height: 170px; position: absolute; right: 19px; bottom: 12px;
      display: grid; place-items: center; font-size: 97px;
      filter: drop-shadow(0 12px 11px rgba(0,0,0,.10));
    }
    .robot::after {
      content: ""; width: 90px; height: 12px; border-radius: 50%;
      background: rgba(0,0,0,.10); position: absolute; bottom: 2px; z-index: -1;
    }
    .online { color: var(--teal); font-weight: 750; font-size: 14px; }
    .hero-card h2 { margin: 28px 0 4px; font-size: 31px; }
    .stats { display: flex; gap: 8px; position: absolute; left: 17px; bottom: 20px; }
    .stat { background: var(--paper); border-radius: 14px; padding: 10px 12px; font-size: 13px; }
    .stat b { display: block; font-size: 17px; margin-bottom: 2px; }
    .grid4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 9px; }
    .action {
      text-align: center; padding: 13px 5px; background: var(--card);
      border: 1px solid var(--line); border-radius: 17px; font-size: 13px;
    }
    .action i { display: block; font-style: normal; font-size: 27px; margin-bottom: 6px; }
    .update-banner { display: flex; align-items: center; gap: 12px; }
    .update-banner .grow { flex: 1; }
    .update-banner b { display: block; margin-bottom: 4px; }
    .update-banner small { color: var(--muted); }
    .btn {
      border: 0; border-radius: 15px; background: var(--duck); color: var(--ink);
      min-height: 47px; padding: 0 18px; font-weight: 800;
    }
    .btn.block { width: 100%; font-size: 17px; }
    .btn.outline { width: 100%; background: transparent; border: 1.5px solid var(--line); }
    .btn.danger { color: var(--red); background: transparent; border: 1.5px solid #efbcbc; }
    .tabs {
      position: absolute; left: 0; right: 0; bottom: 0; height: 81px;
      background: rgba(255,253,248,.97); border-top: 1px solid var(--line);
      display: grid; grid-template-columns: repeat(4,1fr); padding: 8px 10px 16px;
    }
    .tab { text-align: center; color: #696b69; font-size: 12px; font-weight: 650; }
    .tab i { display: block; font-style: normal; font-size: 23px; height: 31px; }
    .tab.active { color: var(--duck-dark); }
    .duck-display { text-align: center; font-size: 94px; margin: 22px 0 8px; }
    .radar {
      width: 110px; height: 110px; margin: 10px auto 18px; border-radius: 50%;
      border: 1px solid #ebd89d;
      background: radial-gradient(circle, var(--duck) 0 5px, transparent 6px),
        repeating-radial-gradient(circle, transparent 0 18px, #eadfbf 19px 20px);
    }
    .device-row, .wifi-row, .setting-row {
      display: flex; align-items: center; gap: 12px; min-height: 58px;
      border-bottom: 1px solid var(--line);
    }
    .device-row:last-child, .wifi-row:last-child, .setting-row:last-child { border: 0; }
    .device-row.selected { border: 1.5px solid var(--duck); border-radius: 15px; padding: 0 12px; }
    .device-row b, .wifi-row b, .setting-row b { flex: 1; }
    .signal { color: var(--teal); font-size: 19px; }
    .steps { display: flex; justify-content: center; gap: 44px; margin: 19px 0; color: #aaa; }
    .steps .on { color: var(--duck-dark); font-weight: 800; }
    .field {
      height: 48px; border: 1.5px solid var(--teal); border-radius: 13px;
      padding: 0 14px; display: flex; align-items: center; color: var(--muted);
      background: var(--teal-soft); margin: 12px 0;
    }
    .security-note { text-align: center; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .mode { display: grid; grid-template-columns: 1fr 1fr; background: #f0ece3; border-radius: 13px; padding: 4px; }
    .mode span { text-align: center; padding: 9px; border-radius: 10px; font-size: 13px; font-weight: 700; }
    .mode .active { background: var(--duck); }
    .pose { min-height: 224px; position: relative; }
    .pose .robot { right: 125px; bottom: 40px; font-size: 84px; }
    .joysticks { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 13px; }
    .joystick-label { font-weight: 750; margin-bottom: 8px; }
    .joystick {
      width: 134px; height: 134px; border: 2px solid #dbd3c3; border-radius: 50%;
      display: grid; place-items: center; margin: auto;
    }
    .stick {
      width: 70px; height: 70px; border-radius: 50%; background: var(--ink); color: white;
      display: grid; place-items: center; font-size: 24px; box-shadow: 0 7px 12px rgba(0,0,0,.16);
    }
    .joystick.teal .stick { background: var(--teal); }
    .stop {
      display: block; margin: -2px auto 10px; border: 1.5px solid var(--red); color: var(--red);
      background: white; border-radius: 999px; padding: 9px 25px; font-weight: 800;
    }
    .quick { display: grid; grid-template-columns: repeat(5,1fr); gap: 7px; }
    .quick div { text-align: center; padding: 9px 2px; background: #fff; border: 1px solid var(--line); border-radius: 13px; font-size: 11px; }
    .quick b { display: block; font-size: 22px; margin-bottom: 4px; }
    .camera-card {
      height: 220px; position: relative; overflow: hidden; padding: 0;
      background:
        linear-gradient(180deg, #91c3d1 0 57%, #c9b998 58% 100%);
    }
    .camera-card::before {
      content: ""; position: absolute; left: 0; right: 0; bottom: 78px; height: 52px;
      background: linear-gradient(14deg, transparent 0 14%, #708b63 15% 40%, transparent 41%),
        linear-gradient(-10deg, transparent 0 58%, #617f59 59% 79%, transparent 80%);
      opacity: .7;
    }
    .camera-duck {
      position: absolute; left: 160px; bottom: 23px; font-size: 78px;
      filter: drop-shadow(0 8px 8px rgba(0,0,0,.22));
    }
    .camera-overlay {
      position: absolute; left: 12px; right: 12px; top: 11px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .camera-tools { display: flex; gap: 8px; }
    .camera-tool {
      width: 36px; height: 36px; border: 0; border-radius: 12px;
      color: white; background: rgba(24,29,30,.62); font-size: 17px;
    }
    .live {
      border-radius: 999px; background: rgba(24,29,30,.65); color: white;
      padding: 7px 10px; font-size: 12px; font-weight: 750;
    }
    .activity { display: flex; align-items: center; gap: 12px; }
    .activity i {
      width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
      background: var(--teal-soft); color: var(--teal); font-style: normal;
    }
    .activity div { flex: 1; }
    .activity b { display: block; }
    .activity small { color: var(--muted); }
    .model-card .model-head { display: flex; align-items: center; gap: 10px; }
    .model-icon { width: 47px; height: 47px; display: grid; place-items: center; background: #fff2c8; border-radius: 13px; font-size: 27px; }
    .model-title { flex: 1; }
    .model-title b { display: block; font-size: 18px; }
    .model-title small { color: var(--muted); }
    .model-meta { color: var(--muted); font-size: 12px; margin: 12px 0; }
    .model-actions { display: flex; align-items: center; justify-content: space-between; }
    .compat { border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; font-size: 11px; color: var(--muted); }
    .flow-card { text-align: center; font-size: 13px; color: var(--muted); }
    .progress-ring {
      width: 170px; height: 170px; margin: 20px auto; border-radius: 50%;
      display: grid; place-items: center; font-size: 45px; font-weight: 850;
      background: conic-gradient(var(--duck) 0 68%, #ebe4d5 68%);
      position: relative;
    }
    .progress-ring::before { content: ""; position: absolute; inset: 14px; border-radius: 50%; background: var(--paper); }
    .progress-ring span { z-index: 1; }
    .timeline { width: 285px; margin: 18px auto; }
    .stage { min-height: 56px; display: flex; gap: 13px; align-items: flex-start; position: relative; }
    .stage i { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: #eee8dc; font-style: normal; z-index: 1; }
    .stage.done i { background: var(--teal); color: white; }
    .stage.active i { background: var(--duck); }
    .stage:not(:last-child)::after { content: ""; position: absolute; left: 13px; top: 27px; height: 30px; border-left: 2px solid #ddd5c5; }
    .stage b { display: block; }
    .stage small { color: var(--muted); }
    .result-duck { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 21px 0; }
    .result-duck .duck { font-size: 102px; }
    .check { width: 62px; height: 62px; display: grid; place-items: center; border-radius: 50%; color: white; background: var(--teal); font-size: 36px; font-weight: 800; }
    .result-title { text-align: center; font-size: 27px; margin: 5px 0 6px; }
    .result-sub { text-align: center; color: var(--teal); font-size: 13px; margin-bottom: 18px; }
    .version-row { display: flex; align-items: center; gap: 12px; min-height: 57px; border-bottom: 1px solid var(--line); }
    .version-row:last-child { border: 0; }
    .version-row b { flex: 1; }
    .section-title { font-size: 16px; margin: 0 0 8px; }
    .health-row { display: flex; align-items: center; min-height: 49px; border-bottom: 1px solid var(--line); gap: 9px; font-size: 14px; }
    .health-row:last-child { border: 0; }
    .health-row b { flex: 1; }
    .health-row span:last-child { font-weight: 750; }
    .good-banner { display: flex; align-items: center; gap: 12px; }
    .good-banner i { font-style: normal; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: white; background: var(--teal); font-size: 24px; }
    .good-banner b { display: block; }
    .good-banner small { color: var(--muted); }

    @media (max-width: 900px) {
      .gallery { grid-template-columns: repeat(2,1fr); }
      .decision { grid-template-columns: repeat(2,1fr); }
      .interaction-guide { grid-template-columns: 1fr; }
    }
    @media (max-width: 590px) {
      .site { padding: 34px 16px 60px; }
      .gallery { grid-template-columns: 1fr; }
      .decision, .rules-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>document.getElementById("app").textContent = "正在载入…";</script>
  <script>
    window.addEventListener("error", event => {
      document.getElementById("app").textContent =
        "页面渲染错误：" + event.message + " @" + event.lineno + ":" + event.colno;
    });
    const screens = [
      ["discovery", "01 添加设备", "BLE 发现、识别和连接；属于首次使用全屏流程。"],
      ["wifi", "02 Wi-Fi 配网", "密码只发给设备；MicroDuck 自己连接网络。"],
      ["home", "03 首页", "统一四栏导航的设备总览和更新入口。"],
      ["control", "04 控制", "局域网/WebRTC 控制；BLE 绝不传运动指令。"],
      ["models", "05 模型", "固定能力槽、版本、签名和兼容性。"],
      ["updating", "06 更新进度", "全屏任务流；断开手机后设备继续。"],
      ["result", "07 更新结果", "显示真实运行版本，并可离线回退。"],
      ["settings", "08 设置", "健康、连接、设备管理和诊断。"]
    ];

    function statusbar() {
      return `<div class="statusbar"><span>9:41</span><span>▮▮▮　⌁　▰</span></div>`;
    }
    function tabs(active) {
      const data = [["home","⌂","首页"],["control","◉","控制"],["models","▦","模型"],["settings","⚙","设置"]];
      return `<nav class="tabs">${data.map(x => `<div class="tab ${active===x[0]?"active":""}"><i>${x[1]}</i>${x[2]}</div>`).join("")}</nav>`;
    }
    function appTopbar(title, right="", back=false) {
      return `<header class="topbar">${back?'<span class="back">‹</span>':""}<h1>${title}</h1>${right}</header>`;
    }
    function phone(content, active=null, full=false) {
      return `<div class="phone">${statusbar()}<main class="screen ${full?"full":""}">${content}</main>${active?tabs(active):""}</div>`;
    }

    function renderScreen(id) {
      if (id === "discovery") return phone(`
        ${appTopbar("添加 MicroDuck","",true)}
        <div class="duck-display">🤖</div>
        <div class="radar"></div>
        <p class="subtitle" style="text-align:center">正在扫描附近的 MicroDuck…</p>
        <section class="card">
          <div class="device-row selected"><span>ᛒ</span><b>duck-c51b · 就在附近</b><span class="signal">信号很强</span></div>
          <div class="device-row"><span>ᛒ</span><b>duck-8a2f</b><span>较远</span></div>
        </section>
        <button class="btn block">连接这只鸭子</button>
        <p class="security-note">🔒 通过蓝牙直接连接，不经过厂商云</p>
        <div class="steps"><span class="on">● 1</span><span>○ 2</span><span>○ 3</span></div>
      `, null, true);

      if (id === "wifi") return phone(`
        ${appTopbar("给鸭子联网","",true)}
        <p class="subtitle">Wi-Fi 由 MicroDuck 自己连接，用于下载模型</p>
        <div class="pill good">ᛒ 蓝牙已连接 · duck-c51b</div>
        <section class="card" style="margin-top:15px">
          <h3 class="section-title">附近 Wi-Fi 网络</h3>
          <div class="wifi-row"><span>🔒</span><b>Studio_2.4G</b><span class="signal">◔</span></div>
          <div class="wifi-row"><span>🔒</span><b>Home</b><span>◔</span></div>
          <div class="wifi-row"><span>🔒</span><b>Phone Hotspot</b><span>◔</span></div>
          <div class="field">••••••••••　　显示</div>
          <p class="online">● 正在连接到 Studio_2.4G…</p>
        </section>
        <button class="btn block">连接 Wi-Fi</button>
        <p class="security-note">🛡 密码仅通过加密蓝牙发送给设备，不上传云端</p>
        <div class="steps"><span>✓ 1</span><span class="on">● 2</span><span>○ 3</span></div>
      `, null, true);

      if (id === "home") return phone(`
        ${appTopbar("Coincoin⌄",'<span class="pill">ᛒ 现场直连　›</span>')}
        <section class="card hero-card">
          <div class="online">● 在线 · 已停止</div>
          <h2>MicroDuck</h2><span class="subtitle">开源双足机器人</span>
          <div class="stats"><div class="stat"><b>78%</b>电池</div><div class="stat"><b>Wi-Fi</b>Studio_2.4G</div></div>
          <div class="robot">🐥</div>
        </section>
        <section class="card update-banner">
          <span style="font-size:28px">⇧</span><div class="grow"><b>行走模型有新版本 1.3.0</b><small>已签名 · 6.2 MB</small></div>
          <button class="btn">查看更新</button>
        </section>
        <section class="card">
          <h3 class="section-title">最近状态</h3>
          <div class="activity"><i>✓</i><div><b>设备安全停稳</b><small>控制循环 50.0 Hz · 刚刚</small></div></div>
        </section>
        <p class="security-note">设备是主体 · 无厂商云账号</p>
      `, "home");

      if (id === "control") return phone(`
        ${appTopbar("控制 Coincoin",'<span>•••</span>')}
        <div class="pill good">◔ 局域网低延迟 · 安全　›</div>
        <section class="card camera-card" style="margin-top:12px">
          <div class="camera-overlay"><span class="live">● 摄像头实时画面</span><div class="camera-tools"><button class="camera-tool">🔇</button><button class="camera-tool">⛶</button></div></div>
          <div class="camera-duck">🐥</div>
        </section>
        <section class="joysticks">
          <div><div class="joystick-label">移动</div><div class="joystick"><div class="stick">＋</div></div></div>
          <div><div class="joystick-label">头部 / 摄像头</div><div class="joystick teal"><div class="stick">◉</div></div></div>
        </section>
        <button class="stop">● 停止</button>
        <section class="quick">
          <div><b>🦆</b>坐下</div><div><b>✋</b>捡起</div><div><b>↙</b>左踢</div><div><b>↘</b>右踢</div><div><b>🔊</b>叫一声</div>
        </section>
        <p class="security-note" style="margin-top:10px">🛡 松手即停，设备安全层拥有最终控制权<br>蓝牙仅用于配网和更新</p>
      `, "control");

      if (id === "models") return phone(`
        ${appTopbar("模型",'<button class="camera-tool" style="color:var(--ink);background:white;border:1px solid var(--line)">↻</button>')}
        <p class="subtitle"><span class="online">● 鸭子已联网</span> · 设备直接从公开仓库下载</p>
        <section class="card model-card">
          <div class="model-head"><div class="model-icon">🦆</div><div class="model-title"><b>行走 Walk</b><small>当前 v1.2.0</small></div><span class="pill">有更新</span><span>›</span></div>
          <div class="model-meta">更新 v1.3.0　·　6.2 MB<br>来源 Hugging Face　·　签名已验证</div>
          <div class="model-actions"><span class="compat">61→14 · API 1</span><button class="btn">更新</button></div>
        </section>
        <section class="card model-card">
          <div class="model-head"><div class="model-icon">🧍</div><div class="model-title"><b>站立 Stand</b><small>当前 v1.1.4</small></div><span class="pill good">✓ 已是最新</span><span>›</span></div>
          <div class="model-actions" style="margin-top:13px"><span class="compat">61→14 · API 1</span></div>
        </section>
        <section class="card model-card">
          <div class="model-head"><div class="model-icon">✋</div><div class="model-title"><b>捡起 Ground Pick</b><small>当前 v0.9.2</small></div><span>›</span></div>
          <div class="model-actions" style="margin-top:13px"><span class="compat">61→14 · API 1</span></div>
        </section>
        <p class="security-note">下拉或点右上角可检查更新 · 不自动安装</p>
      `, "models");

      if (id === "updating") return phone(`
        ${appTopbar("正在更新行走模型","",true)}
        <div class="progress-ring"><span>68%</span></div>
        <p style="text-align:center;font-weight:750">v1.2.0　→　<span style="color:var(--teal)">v1.3.0</span></p>
        <div class="timeline">
          <div class="stage done"><i>✓</i><div><b>安全检查</b><small>已完成</small></div></div>
          <div class="stage active"><i>↓</i><div><b>从公开仓库下载　68%</b><small>下载中…</small></div></div>
          <div class="stage"><i>◇</i><div><b>验证签名</b><small>等待中</small></div></div>
          <div class="stage"><i>↻</i><div><b>切换模型</b><small>等待中</small></div></div>
          <div class="stage"><i>♡</i><div><b>健康检查</b><small>等待中</small></div></div>
        </div>
        <section class="card"><b>ᛒ 蓝牙只接收进度</b><p class="subtitle" style="margin:5px 0 0">下载由 MicroDuck 的 Wi-Fi 完成</p></section>
        <section class="card" style="border-color:#eed48e"><b>⚠ 请让鸭子停稳并保持供电</b></section>
        <button class="btn outline">在后台继续</button>
        <p class="security-note">手机断开后设备仍会继续；重连可恢复进度</p>
      `, null, true);

      if (id === "result") return phone(`
        ${appTopbar("更新完成","",true)}
        <div class="result-duck"><div class="duck">🐥</div><div class="check">✓</div></div>
        <h2 class="result-title">行走模型已更新至 v1.3.0</h2>
        <p class="result-sub">✓ 签名已验证　·　✓ 健康检查通过　·　✓ 控制循环正常</p>
        <button class="btn block">试走一下</button>
        <button class="btn outline" style="margin-top:10px">回到上一版本</button>
        <section class="card" style="margin-top:15px">
          <h3 class="section-title">已安装版本</h3>
          <div class="version-row"><span class="online">●</span><b>v1.3.0<br><small class="online">当前运行</small></b><span class="pill good">当前</span></div>
          <div class="version-row"><span>◷</span><b>v1.2.0<br><small>上一版本</small></b><span>可回退</span></div>
          <div class="version-row"><span>ⓘ</span><b>v1.1.6<br><small>较旧版本</small></b></div>
        </section>
        <p class="security-note">回退不需要联网，不会重新刷机</p>
      `, null, true);

      if (id === "settings") return phone(`
        ${appTopbar("设置")}
        <section class="card good-banner"><i>✓</i><div><b>设备状态正常</b><small>Coincoin · 一切运行正常</small></div></section>
        <section class="card">
          <h3 class="section-title">健康摘要</h3>
          <div class="health-row"><span>〽</span><b>控制循环</b><span>50.0 Hz</span></div>
          <div class="health-row"><span>▣</span><b>电池</b><span>78% · 7.6 V</span></div>
          <div class="health-row"><span>♨</span><b>最高舵机温度</b><span>42°C</span></div>
          <div class="health-row"><span>▦</span><b>行走模型</b><span>v1.3.0</span></div>
        </section>
        <section class="card">
          <h3 class="section-title">连接</h3>
          <div class="health-row"><span>ᛒ</span><b>蓝牙</b><span>现场直连</span></div>
          <div class="health-row"><span>◔</span><b>Wi-Fi</b><span>Studio_2.4G</span></div>
          <div class="health-row"><span>◷</span><b>上次检查更新</b><span>2 分钟前</span></div>
        </section>
        <section class="card">
          <div class="setting-row"><span>🦆</span><b>设备名称</b><span>Coincoin　›</span></div>
          <div class="setting-row"><span>↻</span><b>重新配网</b><span>›</span></div>
          <div class="setting-row"><span>☷</span><b>更新记录</b><span>›</span></div>
          <div class="setting-row"><span>⌘</span><b>开源与许可证</b><span>›</span></div>
          <div class="setting-row"><span>〽</span><b>高级诊断</b><span>›</span></div>
        </section>
        <button class="btn danger block">重启设备</button>
      `, "settings");
    }

    function gallery() {
      const cards = screens.map(([id,title,desc]) =>
        '<article class="shot-card">' +
          '<img src="assets/' + id + '.png" alt="' + title + '">' +
          '<div class="shot-meta"><h2>' + title + '</h2><p>' + desc + '</p>' +
          '<a class="download" href="assets/' + id + '.png" download>↓ 下载 PNG</a></div>' +
        '</article>'
      ).join("");
      return `<div class="site">
        <header class="hero">
          <div class="eyebrow">MICRODUCK CONTROL APP · V0 ARCHIVE · 2026-09-11</div>
          <h1>设备是主体，手机是现场控制台</h1>
          <p class="lead">这是冻结的 v0 基线：全局只有“首页 / 控制 / 模型 / 设置”。后续三层演进不再覆盖这套页面，可从上级目录返回。</p>
          <p class="lead"><a class="video-link" href="../">← 返回三层演进方案</a></p>
          <section class="decision">
            <div><b>BLE</b><span>发现、认证、配网、健康与更新</span></div>
            <div><b>设备 Wi-Fi</b><span>MicroDuck 直接下载签名模型</span></div>
            <div><b>局域网 / WebRTC</b><span>视频、实时状态与运动控制</span></div>
            <div><b>无厂商控制云</b><span>MVP 无账号、商城或订阅</span></div>
          </section>
        </header>
        <main class="gallery">${cards}</main>
        <section class="rules">
          <h2>统一操作规则</h2>
          <div class="rules-grid">
            <p><b>主导航：</b>首页是设备摘要；控制只在局域网通道可用；模型负责检查、更新和回退；设置包含健康、网络、日志和设备管理。</p>
            <p><b>任务流：</b>添加设备与 Wi-Fi 配网在进入 App 前完成；更新进度与结果为全屏流程。返回后仍落在“模型”，不会跳到新的“能力”“数据”或“设备”标签。</p>
          </div>
          <a class="video-link" href="assets/microduck-final-demo.mp4" download>下载完整演示视频（MP4）</a>
        </section>
        <section class="interaction-guide">
          <h2>点击行为已经收敛</h2>
          <article><h3>首页</h3><ul>
            <li><b>Coincoin⌄：</b>打开设备选择器。</li>
            <li><b>现场直连：</b>查看 BLE、Wi-Fi 与局域网连接详情。</li>
            <li><b>设备卡、最近状态：</b>只读，不伪装成按钮。</li>
            <li><b>查看更新：</b>进入行走模型详情，不直接安装。</li>
          </ul></article>
          <article><h3>控制</h3><ul>
            <li><b>视频：</b>默认实时显示；静音和全屏为独立按钮。</li>
            <li><b>移动：</b>持续发送速度，松手回中并立即停。</li>
            <li><b>头部/摄像头：</b>控制头部朝向，摄像头随之转动。</li>
            <li><b>停止：</b>清零移动速度，不断电、不让关节失力。</li>
            <li><b>快捷动作：</b>“坐下”随当前姿态切换为“站起”；左右踢明确分开。服务端接受后锁定冲突动作。</li>
          </ul></article>
          <article><h3>模型</h3><ul>
            <li><b>刷新：</b>检查全部固定槽，不自动安装。</li>
            <li><b>模型行：</b>进入版本、来源、兼容性和历史详情。</li>
            <li><b>更新：</b>先打开确认页和安全检查，再开始下载。</li>
            <li><b>已是最新：</b>状态标签，不可点击。</li>
            <li><b>底部模型标签：</b>回到槽位列表并保留滚动位置。</li>
          </ul></article>
        </section>
      </div>`;
    }

    const query = new URLSearchParams(location.search);
    const id = query.get("screen");
    if (id && screens.some(x => x[0] === id)) {
      document.body.className = "render-page";
      document.getElementById("app").innerHTML = renderScreen(id);
    } else {
      document.getElementById("app").innerHTML = gallery();
    }
  </script>
</body>
</html>
