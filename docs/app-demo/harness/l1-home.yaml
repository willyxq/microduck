name: "L1: field-admin home"
url: http://127.0.0.1:5173
timeout: 30000
viewport:
  width: 390
  height: 844

# Assumes already authenticated to duck-sim.

steps:
  - perceive:
      wait_for_text: "duck-sim"
      assert:
        - text_contains: "duck-sim"
        - min_interactive_elements: 4
        - no_console_errors: true

  - perceive:
      assert:
        - text_contains: "首页"
        - text_contains: "互动"
        - text_contains: "模型"
        - text_contains: "设置"
        - text_not_contains: "控制"
